[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-hep"
version = "0.1.19"
description = "TRACE: Toolkit for Rendering and Analysis of Collider Events -- a lightweight library for reconstructed-level collider-event and vertex displays"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Wasikul Islam, PhD" },
    { name = "Ariel Schwartzman" },
]
keywords = ["hep", "high-energy-physics", "event-display", "collider", "delphes", "lhc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "plotly>=5.0",
]

[project.optional-dependencies]
delphes = ["uproot>=5.0", "awkward>=2.0"]
kaleido = ["kaleido"]
style = ["mplhep"]
opendata = ["atlasopenmagic"]
gui = ["flask>=2.0"]
all = ["trace-hep[delphes,kaleido,style,opendata,gui]"]
dev = ["trace-hep[all]", "pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/wasikulislam/trace-hep"
Issues = "https://github.com/wasikulislam/trace-hep/issues"

[project.scripts]
trace-batch = "tracehep.cli:main"
trace-gui = "tracehep.webapp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracehep"]

[tool.hatch.build.targets.sdist]
include = ["src/tracehep", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
